#        mode: '0600'
#      register: wg_config_created
#      no_log: true

    - name: Generate WireGuard client configurations
      include_tasks: wireguard_client.yml
      loop: "{{ range(1, wireguard_clients + 1) | list }}"
      loop_control:
        loop_var: client_number

    - name: Check if WireGuard interface is already running
      shell: "ip link show wg0 2>/dev/null | grep -q wg0"
      register: wg_already_running
      changed_when: false
      failed_when: false

    - name: Start WireGuard interface (if not already running)
      shell: "wg-quick up wg0 || true"
      register: wg_start_result
      when: wg_already_running.rc != 0
      changed_when: false
      failed_when: false

    - name: Verify WireGuard is running
      shell: "wg show wg0 || (echo 'WireGuard not running' && exit 0)"
      register: wg_verify
      changed_when: false
      failed_when: false

    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'

    - name: Allow DNS
      ufw:
        rule: allow
        port: '53'
        proto: udp

    - name: Allow WireGuard
      ufw:
        rule: allow
        port: "{{ wireguard_port }}"
        proto: udp

    - name: Enable UFW
      ufw:
        state: enabled

#    - name: Verify WireGuard is running
#      command: wg show wg0
#      register: wg_status
#      changed_when: false
#      failed_when: false

    - name: Display WireGuard status
      debug:
        msg:
          - "✓ Pi-hole installation complete!"
          - "Web Interface: https://{{ domain_name }}/admin"
          - "WireGuard Client configs: /etc/wireguard/clients/"
          - "WireGuard Status: {{ 'RUNNING' if wg_status.rc == 0 else 'CHECK LOGS' }}"
        verbosity: 0

