---
- name: Add target host dynamically
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add pihole server to inventory
      add_host:
        name: "{{ lookup('env', 'INSTANCE_IP') }}"
        groups: pihole_servers
        ansible_user: "{{ lookup('env', 'SSH_USER') | default('ansible', true) }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('/mnt/workspace/id_ed25519', true) }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      vars:
        instance_ip: "{{ lookup('env', 'INSTANCE_IP') }}"
      failed_when: not instance_ip
      register: host_added

- name: Setup Pi-hole with WireGuard and Let's Encrypt
  hosts: pihole_servers
  become: true
  gather_facts: true
  vars:
    pihole_password: "{{ lookup('env', 'PIHOLE_PASSWORD') | default('ChangeMe123!', true) }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('pihole.example.com', true) }}"
    email: "{{ lookup('env', 'ADMIN_EMAIL') | default('admin@example.com', true) }}"
    pihole_interface: "{{ lookup('env', 'PIHOLE_INTERFACE') | default('ens4', true) }}"
    wireguard_port: "{{ lookup('env', 'WIREGUARD_PORT') | default('51820', true) }}"
    wireguard_clients: "{{ lookup('env', 'WIREGUARD_CLIENTS') | default('5', true) | int }}"
    pihole_installer_url: "https://install.pi-hole.net"

  tasks:
    - name: Wait for connection (OS Login propagation)
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - git
          - ufw
          - certbot
          - python3-certbot-nginx
          - nginx
          - wireguard
          - wireguard-tools
          - qrencode
          - iptables-persistent
          - mc
        state: present
        update_cache: yes
      register: apt_install_result
      retries: 3
      delay: 10
      until: apt_install_result is succeeded
      failed_when:
        - apt_install_result is failed
        - '"Unable to locate package" in apt_install_result.stderr or "E: " in apt_install_result.stderr'

    - name: Check if wg command is available
      shell: which wg
      register: wg_check
      changed_when: false
      failed_when: false

    - name: Install wireguard-go if wg not available (fallback)
      apt:
        name:
          - wireguard-go
          - wireguard-tools
        state: present
        update_cache: yes
      when: wg_check.rc != 0
      retries: 3
      delay: 10
      until: wg_go_result is succeeded
      register: wg_go_result
      ignore_errors: yes

    - name: Verify WireGuard installation after fallback
      shell: |
        if command -v wg &> /dev/null; then
          echo "✓ WireGuard tools available"
          wg --version || true
        else
          echo "⚠ WireGuard tools not found"
        fi
      changed_when: false
      failed_when: false

    - name: Check if Pi-hole is already installed
      stat:
        path: /usr/local/bin/pihole
      register: pihole_installed

    - name: Install mc if apt install failed (fallback)
      shell: apt-get install -y mc || true
      changed_when: false
      failed_when: false
      register: mc_install_fallback

    - name: Download Pi-hole installer
      get_url:
        url: "{{ pihole_installer_url }}"
        dest: "/tmp/basic-install.sh"
        mode: '0755'
        force: yes
      register: download_result
      # Jeśli nadal masz 405, dodaj poniższe:
      # headers:
      #   User-Agent: "Mozilla/5.0"
      when: not pihole_installed.stat.exists

    - name: Create Pi-hole setup vars file
      copy:
        content: |
          PIHOLE_INTERFACE={{ pihole_interface }}
          IPV4_ADDRESS=$(ip -4 addr show {{ pihole_interface }} | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
          IPV6_ADDRESS=
          PIHOLE_DNS_1=1.1.1.1
          PIHOLE_DNS_2=1.0.0.1
          QUERY_LOGGING=true
          INSTALL_WEB_SERVER=true
          INSTALL_WEB_INTERFACE=true
          LIGHTTPD_ENABLED=true
          WEBPASSWORD={{ pihole_password }}
          BLOCKING_ENABLED=true
        dest: /tmp/setupVars.conf
      when: not pihole_installed.stat.exists
      no_log: true

    - name: Install Pi-hole
      shell: |
        mkdir -p /etc/pihole
        cp /tmp/setupVars.conf /etc/pihole/setupVars.conf
        bash /tmp/pihole-install.sh --unattended
      args:
        creates: /usr/local/bin/pihole
      when: not pihole_installed.stat.exists
      failed_when: pihole_install.rc not in [0, 1]
      register: pihole_install

    - name: Stop lighttpd to free port 80
      systemd:
        name: lighttpd
        state: stopped
        enabled: no
      ignore_errors: yes
      register: lighttpd_stop

    - name: Configure Nginx for Pi-hole
      copy:
        content: |
          server {
              listen 80;
              server_name {{ domain_name }};

              location /.well-known/acme-challenge/ {
                  root /var/www/html;
              }

              location / {
                  return 301 https://$server_name$request_uri;
              }
          }

          server {
              listen 443 ssl http2;
              server_name {{ domain_name }};

              ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;

              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers HIGH:!aNULL:!MD5;
              ssl_prefer_server_ciphers on;

              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /admin {
                  proxy_pass http://127.0.0.1:8080/admin;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
        dest: /etc/nginx/sites-available/pihole
      notify: restart nginx

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/pihole
        dest: /etc/nginx/sites-enabled/pihole
        state: link
        force: yes

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

    - name: Change lighttpd port to 8080
      lineinfile:
        path: /etc/lighttpd/lighttpd.conf
        regexp: '^server.port\s*='
        line: 'server.port = 8080'
      notify: restart lighttpd
      when: lighttpd_stop.changed

    - name: Start and enable lighttpd
      systemd:
        name: lighttpd
        daemon_reload: yes
        state: started
        enabled: yes
      when: lighttpd_stop.changed

    - name: Obtain Let's Encrypt certificate
      command: >
        certbot certonly --nginx
        --non-interactive
        --agree-tos
        --email {{ email }}
        -d {{ domain_name }}
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
      register: certbot_result
      failed_when: certbot_result.rc not in [0, 1]

    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Generate WireGuard server private key
      shell: wg genkey
      register: wg_server_private_key
      changed_when: false
      failed_when: wg_server_private_key.rc != 0

    - name: Generate WireGuard server public key
      shell: echo "{{ wg_server_private_key.stdout }}" | wg pubkey
      register: wg_server_public_key
      changed_when: false
      failed_when: wg_server_public_key.rc != 0
      no_log: true

    - name: Create WireGuard server configuration
      copy:
        content: |
          [Interface]
          Address = 10.8.0.1/24
          ListenPort = {{ wireguard_port }}
          PrivateKey = {{ wg_server_private_key.stdout }}
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o {{ pihole_interface }} -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o {{ pihole_interface }} -j MASQUERADE
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
      register: wg_config_created
      no_log: true

    - name: Generate WireGuard client configurations
      include_tasks: wireguard_client.yml
      loop: "{{ range(1, wireguard_clients + 1) | list }}"
      loop_control:
        loop_var: client_number

    - name: Verify WireGuard configuration file exists
      stat:
        path: /etc/wireguard/wg0.conf
      register: wg_conf_stat
      failed_when: not wg_conf_stat.stat.exists

    - name: Check if WireGuard interface is already running
      shell: "ip link show wg0 2>/dev/null | grep -q wg0"
      register: wg_already_running
      changed_when: false
      failed_when: false

    - name: Start WireGuard interface (if not already running)
      shell: "wg-quick up wg0 || true"
      register: wg_start_result
      when: wg_already_running.rc != 0
      changed_when: false
      failed_when: false

    - name: Verify WireGuard is running
      shell: "wg show wg0 || (echo 'WireGuard not running' && exit 0)"
      register: wg_verify
      changed_when: false
      failed_when: false

    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'

    - name: Allow DNS
      ufw:
        rule: allow
        port: '53'
        proto: udp

    - name: Allow WireGuard
      ufw:
        rule: allow
        port: "{{ wireguard_port }}"
        proto: udp

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Verify WireGuard is running
      command: wg show wg0
      register: wg_status
      changed_when: false
      failed_when: false

    - name: Display WireGuard status
      debug:
        msg:
          - "✓ Pi-hole installation complete!"
          - "Web Interface: https://{{ domain_name }}/admin"
          - "WireGuard Client configs: /etc/wireguard/clients/"
          - "WireGuard Status: {{ 'RUNNING' if wg_status.rc == 0 else 'CHECK LOGS' }}"
        verbosity: 0
      no_log: true

    - name: Verify all client configs were created
      find:
        path: /etc/wireguard/clients
        pattern: "client*.conf"
      register: client_configs
      failed_when: client_configs.matched < wireguard_clients | int

    - name: Display created client configurations
      debug:
        msg: "✓ Created {{ client_configs.matched }} WireGuard client configs"
        verbosity: 0

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart lighttpd
      systemd:
        name: lighttpd
        state: restarted
