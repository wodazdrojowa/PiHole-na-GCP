
---
- name: Setup Pi-hole with WireGuard and Let's Encrypt
  hosts: pihole-serwer
  become: yes
  vars:
    pihole_password: "{{ lookup('env', 'PIHOLE_PASSWORD') | default('ChangeMe123!', true) }}"
    domain_name: "pihole.example.com"  # Zmień na swoją domenę
    email: "admin@example.com"  # Zmień na swój email
    wireguard_port: 51820
    wireguard_clients: 5

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - curl
          - wget
          - git
          - ufw
          - certbot
          - python3-certbot-nginx
          - nginx
          - wireguard
          - wireguard-tools
          - qrencode
          - iptables-persistent
        state: present

    # Pi-hole Installation
    - name: Check if Pi-hole is already installed
      stat:
        path: /usr/local/bin/pihole
      register: pihole_installed

    - name: Download Pi-hole installer
      get_url:
        url: https://install.pi-hole.net
        dest: /tmp/pihole-install.sh
        mode: '0755'
      when: not pihole_installed.stat.exists

    - name: Create Pi-hole setup vars file
      copy:
        content: |
          PIHOLE_INTERFACE=ens4
          IPV4_ADDRESS=$(ip -4 addr show ens4 | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
          IPV6_ADDRESS=
          PIHOLE_DNS_1=1.1.1.1
          PIHOLE_DNS_2=1.0.0.1
          QUERY_LOGGING=true
          INSTALL_WEB_SERVER=true
          INSTALL_WEB_INTERFACE=true
          LIGHTTPD_ENABLED=true
          WEBPASSWORD={{ pihole_password }}
          BLOCKING_ENABLED=true
        dest: /tmp/setupVars.conf
      when: not pihole_installed.stat.exists

    - name: Install Pi-hole
      shell: |
        mkdir -p /etc/pihole
        cp /tmp/setupVars.conf /etc/pihole/setupVars.conf
        bash /tmp/pihole-install.sh --unattended
      args:
        creates: /usr/local/bin/pihole
      when: not pihole_installed.stat.exists

    # Nginx Configuration
    - name: Stop lighttpd to free port 80
      systemd:
        name: lighttpd
        state: stopped
        enabled: no

    - name: Configure Nginx for Pi-hole
      copy:
        content: |
          server {
              listen 80;
              server_name {{ domain_name }};
              
              location /.well-known/acme-challenge/ {
                  root /var/www/html;
              }
              
              location / {
                  return 301 https://$server_name$request_uri;
              }
          }
          
          server {
              listen 443 ssl http2;
              server_name {{ domain_name }};
              
              ssl_certificate /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/{{ domain_name }}/privkey.pem;
              
              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers HIGH:!aNULL:!MD5;
              ssl_prefer_server_ciphers on;
              
              location / {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              
              location /admin {
                  proxy_pass http://127.0.0.1:8080/admin;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
        dest: /etc/nginx/sites-available/pihole
      notify: restart nginx

    - name: Enable Nginx site
      file:
        src: /etc/nginx/sites-available/pihole
        dest: /etc/nginx/sites-enabled/pihole
        state: link
      notify: restart nginx

    - name: Remove default Nginx site
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: restart nginx

    - name: Change lighttpd port to 8080
      lineinfile:
        path: /etc/lighttpd/lighttpd.conf
        regexp: '^server.port\s*='
        line: 'server.port = 8080'
      notify: restart lighttpd

    - name: Start and enable lighttpd
      systemd:
        name: lighttpd
        state: started
        enabled: yes

    # Let's Encrypt
    - name: Obtain Let's Encrypt certificate
      command: >
        certbot certonly --nginx
        --non-interactive
        --agree-tos
        --email {{ email }}
        -d {{ domain_name }}
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem

    # WireGuard Configuration
    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Generate WireGuard server private key
      shell: wg genkey
      register: wg_server_private_key
      changed_when: false

    - name: Generate WireGuard server public key
      shell: echo "{{ wg_server_private_key.stdout }}" | wg pubkey
      register: wg_server_public_key
      changed_when: false

    - name: Create WireGuard server configuration
      template:
        content: |
          [Interface]
          Address = 10.8.0.1/24
          ListenPort = {{ wireguard_port }}
          PrivateKey = {{ wg_server_private_key.stdout }}
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o ens4 -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o ens4 -j MASQUERADE
        dest: /etc/wireguard/wg0.conf
        mode: '0600'

    - name: Generate WireGuard client configurations
      include_tasks: wireguard_client.yml
      loop: "{{ range(1, wireguard_clients + 1) | list }}"
      loop_control:
        loop_var: client_number

    - name: Start and enable WireGuard
      systemd:
        name: wg-quick@wg0
        state: started
        enabled: yes

    # Firewall Configuration
    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'

    - name: Allow DNS
      ufw:
        rule: allow
        port: '53'

    - name: Allow WireGuard
      ufw:
        rule: allow
        port: "{{ wireguard_port }}"
        proto: udp

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Display connection information
      debug:
        msg:
          - "Pi-hole installation complete!"
          - "Web Interface: https://{{ domain_name }}/admin"
          - "Password: {{ pihole_password }}"
          - "WireGuard Server Public Key: {{ wg_server_public_key.stdout }}"
          - "Client configurations saved in /etc/wireguard/clients/"

  handlers:
    - name: restart nginx
      systemd:
        name: nginx
        state: restarted

    - name: restart lighttpd
      systemd:
        name: lighttpd
        state: restarted