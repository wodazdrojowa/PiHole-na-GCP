---
# Ogólna rada: przeszukaj cały pihole-setup.yml i pliki dołączane (wireguard_client.yml itd.)
# pod kątem modułu systemd/service — to jedyny typ modułu, który w check mode realnie odpytuje
# system (systemctl show), więc każde takie zadanie zależne od pakietu instalowanego w tym samym
# przebiegu potrzebuje when: not ansible_check_mode


# ============================================================
# Play 1: Dynamically add host to inventory based on
# environment variables from Terraform/Spacelift
# ============================================================
- name: Add target host dynamically
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add pihole server to inventory
      add_host:
        name: "{{ lookup('env', 'INSTANCE_IP') }}"
        groups: pihole_servers
        ansible_user: "{{ lookup('env', 'SSH_USER') | default('ansible', true) }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('/mnt/workspace/id_ed25519', true) }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      vars:
        instance_ip: "{{ lookup('env', 'INSTANCE_IP') }}"
      failed_when: not instance_ip
      register: host_added

# ============================================================
# Play 2: Installl and configure Pi-hole + WireGuard + Nginx/Let's Encrypt
# ============================================================
- name: Setup Pi-hole with WireGuard and Let's Encrypt
  hosts: pihole_servers
  become: true
  gather_facts: true
  vars:
    pihole_password: "{{ lookup('env', 'PIHOLE_PASSWORD') | default('ChangeMe123!', true) }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('pihole.example.com1', true) }}"
    email: "{{ lookup('env', 'USER_EMAIL') | default('admin@example.com', true) }}"
    pihole_interface: "{{ lookup('env', 'PIHOLE_INTERFACE') | default('ens4', true) }}"
    wireguard_port: "{{ lookup('env', 'WIREGUARD_PORT') | default('51820', true) }}"
    wireguard_clients: "{{ lookup('env', 'WIREGUARD_CLIENTS') | default('2', true) | int }}"
    pihole_installer_url: "https://install.pi-hole.net"

    # Konfiguracja roli geerlingguy.pihole
    pihole_webpassword: "{{ pihole_password }}"
    pihole_interface_name: "{{ pihole_interface }}"
    pihole_dns_1: "1.1.1.1"
    pihole_dns_2: "8.8.8.8"
    pihole_installation_state: present

  tasks:
    - name: Wait for connection (OS Login propagation)
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install core required packages
      become: true  # <--- root privileges are revuired to install packages
      apt:
        name:
          - curl
          - wget
          - git
          - ufw
          - certbot
          - python3-certbot-nginx
#          - nginx
          - wireguard-tools
          - qrencode
          - iptables-persistent
          - wireguard
          - mc
        state: present
        update_cache: yes
      register: apt_core_result
      retries: 3
      delay: 10
      until: apt_core_result is succeeded

    - name: Update and upgrade apt packages
      become: true
      apt:
       update_cache: yes
       cache_valid_time: 3600
       upgrade: dist  # Optional: Adds the upgrade action if you want to update packages too

    - name: Show core packages installation result
      debug:
        var: apt_core_result

    - name: Check if Pi-hole is already installed
      stat:
        path: /usr/local/bin/pihole
      register: pihole_installed

    - name: Remove old Pi-hole installer if exists
      file:
        path: /tmp/pihole-install.sh
        state: absent
      when:
        - not pihole_installed.stat.exists

    - name: Download Pi-hole installer via curl
      shell: "curl -L {{ pihole_installer_url }} -o /tmp/pihole-install.sh"
      args:
        creates: /tmp/pihole-install.sh
      register: download_result
      when: not pihole_installed.stat.exists

    - name: Create Pi-hole setup vars file
      copy:
        content: |
          PIHOLE_INTERFACE={{ pihole_interface }}
          IPV4_ADDRESS=$(ip -4 addr show {{ pihole_interface }} | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
          IPV6_ADDRESS=
          PIHOLE_DNS_1=1.1.1.1
          PIHOLE_DNS_2=1.0.0.1
          QUERY_LOGGING=true
          WEBPASSWORD={{ pihole_password }}
          BLOCKING_ENABLED=true
        dest: /tmp/setupVars.conf
      when: not pihole_installed.stat.exists
      no_log: false

    - name: Install Pi-hole
      shell: |
        mkdir -p /etc/pihole
        cp /tmp/setupVars.conf /etc/pihole/setupVars.conf
        bash /tmp/pihole-install.sh --unattended
      args:
        creates: /usr/local/bin/pihole
      when: not pihole_installed.stat.exists
      failed_when: pihole_install.rc not in [0, 1]
      register: pihole_install

    - name: Restart pihole-FTL to apply webserver config
      systemd:
        name: pihole-FTL
        state: restarted
      when: not ansible_check_mode

    - name: Ensure webroot directory exists
      file:
        path: /var/www/html/.well-known/acme-challenge
        state: directory
        mode: '0755'
        recurse: yes

    - name: Obtain Let's Encrypt certificate (webroot mode)
      command: >
        certbot certonly --webroot
        -w /var/www/html
        --non-interactive
        --agree-tos
        --email {{ lookup('env', 'USER_EMAIL') | default('admin@example.com', true) }}
        -d {{ domain_name }}
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
      register: certbot_result
      failed_when: certbot_result.rc not in [0, 1]

    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Install WireGuard
      apt:
        name: wireguard
        state: present
        update_cache: yes

    - name: Check if WireGuard server config already exists
      stat:
        path: /etc/wireguard/wg0.conf
      register: wg0_conf

    - name: Generate WireGuard server private key
      shell: wg genkey
      register: wg_server_private_key
      changed_when: false
      failed_when: wg_server_private_key.rc != 0
      no_log: true
      when: not wg0_conf.stat.exists

    - name: Generate WireGuard server public key
      shell: echo "{{ wg_server_private_key.stdout }}" | wg pubkey
      register: wg_server_public_key
      changed_when: false
      failed_when: wg_server_public_key.rc != 0
      no_log: true
      when: not wg0_conf.stat.exists

    - name: Create WireGuard server configuration (interface only, peers added below)
      copy:
        content: |
          [Interface]
          Address = 10.8.0.1/24
          ListenPort = {{ wireguard_port }}
          PrivateKey = {{ wg_server_private_key.stdout }}
          PostUp = iptables -A FORWARD -i wg0 -j ACCEPT; iptables -t nat -A POSTROUTING -o {{ pihole_interface }} -j MASQUERADE
          PostDown = iptables -D FORWARD -i wg0 -j ACCEPT; iptables -t nat -D POSTROUTING -o {{ pihole_interface }} -j MASQUERADE
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
      when: not wg0_conf.stat.exists
      no_log: true
      
    - name: Check if WireGuard clients directory exists
      ansible.builtin.stat:
        path: /etc/wireguard/clients  # adjust this path to match your setup
      register: wg_clients_dir

    - name: Generate WireGuard client configurations
      include_tasks: wireguard_client.yml
      loop: "{{ range(1, wireguard_clients + 1) | list }}"
      loop_control:
        loop_var: client_number
      when: not wg_clients_dir.stat.exists

    - name: Start and enable WireGuard
      systemd:
        name: wg-quick@wg0
        daemon_reload: yes
        state: started
        enabled: yes
      when: not ansible_check_mode
#      ignore_errors: true

    - name: Configure UFW defaults
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Allow SSH
      ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP/HTTPS
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - '80'
        - '443'

    - name: Allow DNS
      ufw:
        rule: allow
        port: '53'
        proto: udp

    - name: Allow WireGuard
      ufw:
        rule: allow
        port: "{{ wireguard_port }}"
        proto: udp

    - name: Enable UFW
      ufw:
        state: enabled

    - name: Check WireGuard status
      command: systemctl is-active wg-quick@wg0
      register: wg_status
      changed_when: false
      failed_when: false

    - name: Display WireGuard status
      debug:
        msg:
          - "✓ Pi-hole installation complete!"
          - "Web Interface: https://{{ domain_name }}/admin"
          - "WireGuard Client configs: /etc/wireguard/clients/"
          - "WireGuard Status: {{ 'RUNNING' if wg_status.rc == 0 else 'CHECK LOGS' }}"
        verbosity: 0

    - name: Ensure WireGuard clients directory exists
      file:
        path: /etc/wireguard/clients
        state: directory
        mode: '0700'

    - name: Verify all client configs were created
      find:
        path: /etc/wireguard/clients
        pattern: "client*.conf"
      register: client_configs
      failed_when:
        - not ansible_check_mode
        - client_configs.matched < wireguard_clients | int
      when: not ansible_check_mode

    - name: Display created client configurations
      debug:
        msg: "✓ Created {{ client_configs.matched }} WireGuard client configs"
      when: not ansible_check_mode

    - name: Check Pi-hole version
      command: pihole -v
      register: pihole_version_output
      changed_when: false
      ignore_errors: yes

    - name: Show Pi-hole version
      debug:
        var: pihole_version_output.stdout_lines

  handlers:
    - name: restart pihole-FTL
      systemd:
        name: pihole-FTL
        state: restarted
      when: not ansible_check_mode

    - name: Utwórz plik index.html z kodem przekierowania
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        owner: www-data
        group: www-data
        mode: '0644'
        content: |
          <!DOCTYPE html>
          <html lang="pl">
          <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url={{ target_url }}">
              <title>Przekierowywanie...</title>
          </head>
          <body>
              <p>Jeśli przekierowanie nie nastąpi automatycznie, <a href="{{ target_url }}">kliknij tutaj</a>.</p>
          </body>
          </html>

# ============================================================
# Play 3: Verify and summarise results
# ============================================================
- name: Pi-hole installation verification
  hosts: pihole_servers
  become: true
  gather_facts: false

  vars:
    pihole_ip: "{{ ansible_host | default(lookup('env','PIHOLE_IP') | default('127.0.0.1')) }}"
    test_domains:
      - google.com
      - example.com
      - badads.test
    http_port: 80
    dns_ports: [53]
    check_ipv6: false

  tasks:

    - name: Ensure pingable
      ansible.builtin.command: ping -c 1 google.com

    - name: Check pihole-FTL service status
      shell: systemctl is-active pihole-FTL
      register: ftl_status
      ignore_errors: true
      changed_when: false

    - name: Pokaz wynik z konsoli
      ansible.builtin.debug:
        var: ftl_status

    - name: Test local DNS (127.0.0.1) for primary domain
      shell: dig @127.0.0.1 +short {{ test_domains[0] }}
      register: dig_local
      changed_when: false

    - name: Pokaz wynik z Test local DNS (127.0.0.1)
      ansible.builtin.debug:
        var: dig_local

    - name: Test DNS using Pi-hole IP for second domain
      shell: dig @{{ pihole_ip }} +short {{ test_domains[1] }}
      register: dig_remote
      changed_when: false

    - name: Test blocking domain (third domain)
      shell: dig @{{ pihole_ip }} +short {{ test_domains[2] }}
      register: dig_block_test
      changed_when: false

    - name: Check web admin reachable
      uri:
        url: "https://{{ domain_name }}:{{ http_port }}/admin"
        method: GET
        return_content: false
        status_code: 200
        validate_certs: yes
      register: web_admin
      ignore_errors: true

    - name: Check listening ports (53, 80)
      shell: ss -tulpn | egrep -w '(:53|:80)'
      register: ss_ports
      changed_when: false

    - name: Check DNS port binding for 53 UDP/TCP
      shell: ss -u -n -l -p | egrep ':53\b' || true
      register: ss_udp_53
      changed_when: false

    - name: Check DNS port binding for 53 TCP
      shell: ss -t -n -l -p | egrep ':53\b' || true
      register: ss_tcp_53
      changed_when: false

    - name: Check webserver process for admin (lighttpd/nginx/apache)
      shell: ps aux | egrep -i 'lighttpd|nginx|apache2' | egrep -v 'egrep' || true
      register: web_process
      changed_when: false

    - name: Run pihole -v (version)
      shell: pihole -v
      register: pihole_version
      changed_when: false
      ignore_errors: true

    - name: Run pihole status (if available)
      shell: pihole status
      register: pihole_status
      changed_when: false
      ignore_errors: true

    - name: Update gravity lists (dry-run ping to pihole -g)
      shell: pihole -g --nolog
      register: pihole_g
      changed_when: false
      ignore_errors: true

    - name: Collect results
      set_fact:
        pihole_check_results:
          ftl_status: "{{ ftl_status.stdout | default('unknown') }}"
          ftl_journal_tail: "{{ ftl_journal.stdout | default('') }}"
          dig_local: "{{ dig_local.stdout_lines | default([]) }}"
          dig_remote: "{{ dig_remote.stdout_lines | default([]) }}"
          dig_block_test: "{{ dig_block_test.stdout_lines | default([]) }}"
          web_admin_status: "{{ web_admin.status | default('unreachable') }}"
          ss_ports: "{{ ss_ports.stdout | default('') }}"
          ss_udp_53: "{{ ss_udp_53.stdout | default('') }}"
          ss_tcp_53: "{{ ss_tcp_53.stdout | default('') }}"
          web_process: "{{ web_process.stdout | default('') }}"
          pihole_version: "{{ pihole_version.stdout | default('') }}"
          pihole_status: "{{ pihole_status.stdout | default('') }}"
          pihole_g: "{{ pihole_g.stdout | default('') }}"
          check_ipv6: "{{ check_ipv6 | bool }}"

    - name: Display summary
      debug:
        var: pihole_check_results