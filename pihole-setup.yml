---
# ============================================================
# Play 1: Dynamiczne dodanie hosta
# ============================================================
- name: Add target host dynamically
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add pihole server to inventory
      add_host:
        name: "{{ lookup('env', 'INSTANCE_IP') }}"
        groups: pihole_servers
        ansible_user: "{{ lookup('env', 'SSH_USER') | default('ansible', true) }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_PATH') | default('/mnt/workspace/id_ed25519', true) }}"
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      vars:
        instance_ip: "{{ lookup('env', 'INSTANCE_IP') }}"
      failed_when: not instance_ip

# ============================================================
# Play 2: Instalacja i konfiguracja Pi-hole v6 + WireGuard + Let's Encrypt
# ============================================================
- name: Setup Pi-hole with WireGuard and Let's Encrypt HTTPS
  hosts: pihole_servers
  become: true
  gather_facts: true
  vars:
    pihole_password: "{{ lookup('env', 'PIHOLE_PASSWORD') | default('ChangeMe123!', true) }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('', true) }}"
    email: "{{ lookup('env', 'USER_EMAIL') | default('admin@example.com', true) }}"
    pihole_interface: "{{ ansible_default_ipv4.interface }}"
    wireguard_port: "{{ lookup('env', 'WIREGUARD_PORT') | default('443', true) }}"
    wireguard_clients: "{{ lookup('env', 'WIREGUARD_CLIENTS') | default('2', true) | int }}"
    pihole_tls_pem: "/etc/pihole/tls.pem"

  tasks:
    - name: Wait for connection (OS Login propagation)
      wait_for_connection:
        delay: 10
        timeout: 120

    - name: Install all required packages
      apt:
        name:
          - curl
          - wget
          - git
          - ufw
          - certbot
          - python3-certbot-dns-ovh
          - wireguard-tools
          - qrencode
          - iptables-persistent
          - wireguard
          - mc
          - qrencode
        state: present
        update_cache: yes
        cache_valid_time: 3600
      register: apt_result
      retries: 3
      delay: 10
      until: apt_result is succeeded

    - name: Check if Pi-hole is already installed
      stat:
        path: /usr/local/bin/pihole
      register: pihole_installed

    - name: Download Pi-hole installer
      shell: "curl -fsSL https://install.pi-hole.net -o /tmp/pihole-install.sh && chmod +x /tmp/pihole-install.sh"
      args:
        creates: /tmp/pihole-install.sh
      when: not pihole_installed.stat.exists

    - name: Create Pi-hole setup vars file
      copy:
        content: |
          PIHOLE_INTERFACE={{ pihole_interface }}
          IPV4_ADDRESS=$(ip -4 addr show {{ pihole_interface }} | grep -oP '(?<=inet\s)\d+(\.\d+){3}')
          IPV6_ADDRESS=
          PIHOLE_DNS_1=1.1.1.1
          PIHOLE_DNS_2=1.0.0.1
          QUERY_LOGGING=true
          WEBPASSWORD={{ pihole_password }}
          BLOCKING_ENABLED=true
        dest: /tmp/setupVars.conf
      when: not pihole_installed.stat.exists

    - name: Install Pi-hole unattended
      shell: |
        mkdir -p /etc/pihole
        cp /tmp/setupVars.conf /etc/pihole/setupVars.conf
        bash /tmp/pihole-install.sh --unattended
      args:
        creates: /usr/local/bin/pihole
      when: not pihole_installed.stat.exists
      register: pihole_install
      failed_when: pihole_install.rc not in [0, 1]

    # ============================================================
    # LET'S ENCRYPT via DNS challenge (OVH)
    # ============================================================
    - name: Create OVH credentials file for certbot
      copy:
        dest: "/etc/letsencrypt/ovh.ini"
        content: |
          dns_ovh_endpoint = ovh-eu
          dns_ovh_application_key = {{ ovh_app_key }}
          dns_ovh_application_secret = {{ ovh_app_secret }}
          dns_ovh_consumer_key = {{ ovh_consumer_key }}
        mode: '0600'
      when:
        - domain_name | length > 0
        - ovh_app_key | length > 0

    - name: Obtain Let's Encrypt certificate via DNS challenge
      command: >
        certbot certonly --dns-ovh
        --dns-ovh-credentials /etc/letsencrypt/ovh.ini
        --non-interactive --agree-tos --email {{ email }} -d {{ domain_name }}
      args:
        creates: /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem
      register: certbot_result
      failed_when: certbot_result.rc not in [0, 1]
      when:
        - domain_name | length > 0
        - ovh_app_key | length > 0

    - name: Remove old self-signed PEM if exists
      file:
        path: "{{ pihole_tls_pem }}"
        state: absent
      when:
        - domain_name | length > 0
        - certbot_result.rc is defined
        - certbot_result.rc == 0

    - name: Combine private key + fullchain into PEM for Pi-hole v6
      shell: |
        set -e
        cat /etc/letsencrypt/live/{{ domain_name }}/privkey.pem \
            /etc/letsencrypt/live/{{ domain_name }}/fullchain.pem > {{ pihole_tls_pem }}
        chown pihole:pihole {{ pihole_tls_pem }}
        chmod 600 {{ pihole_tls_pem }}
      when:
        - domain_name | length > 0
        - certbot_result.rc is defined
        - certbot_result.rc == 0

    - name: Configure Pi-hole v6 domain
      command: "pihole-FTL --config webserver.domain {{ domain_name }}"
      register: domain_config
      changed_when: "'set' in domain_config.stdout"
      when:
        - domain_name | length > 0
        - certbot_result.rc is defined
        - certbot_result.rc == 0

    - name: Configure Pi-hole v6 TLS certificate
      command: "pihole-FTL --config webserver.tls.cert {{ pihole_tls_pem }}"
      register: tls_config
      changed_when: "'set' in tls_config.stdout"
      when:
        - domain_name | length > 0
        - certbot_result.rc is defined
        - certbot_result.rc == 0

    - name: Create certbot deploy hook for auto-renewal
      copy:
        dest: "/etc/letsencrypt/renewal-hooks/deploy/99-pihole.sh"
        content: |
          #!/bin/bash
          # Auto-renew hook for Pi-hole v6 TLS
          # Always overwrite PEM to ensure fullchain (cert + intermediate) is included
          DOMAIN="{{ domain_name }}"
          PIHOLE_PEM="{{ pihole_tls_pem }}"
          rm -f ${PIHOLE_PEM}
          cat /etc/letsencrypt/live/${DOMAIN}/privkey.pem \
              /etc/letsencrypt/live/${DOMAIN}/fullchain.pem > ${PIHOLE_PEM}
          chown pihole:pihole ${PIHOLE_PEM}
          chmod 600 ${PIHOLE_PEM}
          systemctl restart pihole-FTL
        mode: '0755'
      when:
        - domain_name | length > 0
        - certbot_result.rc is defined
        - certbot_result.rc == 0

    - name: Create certbot pre-hook to stop pihole-FTL before renew
      copy:
        dest: "/etc/letsencrypt/renewal-hooks/pre/99-stop-pihole.sh"
        content: |
          #!/bin/bash
          systemctl stop pihole-FTL
        mode: '0755'
      when:
        - domain_name | length > 0
        - certbot_result.rc is defined
        - certbot_result.rc == 0

    - name: Create certbot post-hook to start pihole-FTL after renew
      copy:
        dest: "/etc/letsencrypt/renewal-hooks/post/99-start-pihole.sh"
        content: |
          #!/bin/bash
          systemctl start pihole-FTL
        mode: '0755'
      when:
        - domain_name | length > 0
        - certbot_result.rc is defined
        - certbot_result.rc == 0

    - name: Restart pihole-FTL to apply all changes
      systemd:
        name: pihole-FTL
        state: restarted
      when: not ansible_check_mode

    # ============================================================
    # WIREGUARD
    # ============================================================
    - name: Enable IP forwarding
      sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Check if WireGuard config exists
      stat:
        path: /etc/wireguard/wg0.conf
      register: wg0_conf

    - name: Generate WireGuard server private key
      shell: wg genkey
      register: wg_server_privkey
      changed_when: false
      no_log: true
      when: not wg0_conf.stat.exists

    - name: Generate WireGuard server public key
      shell: echo "{{ wg_server_privkey.stdout }}" | wg pubkey
      register: wg_server_pubkey
      changed_when: false
      no_log: true
      when: not wg0_conf.stat.exists

    - name: Save server public key for client configs
      set_fact:
        wg_server_public_key: "{{ wg_server_pubkey.stdout }}"
      when: not wg0_conf.stat.exists

    - name: Create WireGuard server config
      template:
        src: wg0.conf.j2
        dest: /etc/wireguard/wg0.conf
        mode: '0600'
      when: not wg0_conf.stat.exists
      no_log: true

    - name: Ensure WireGuard clients directory
      file:
        path: /etc/wireguard/clients
        state: directory
        mode: '0700'

    - name: Generate WireGuard client configurations
      include_tasks: wireguard_client.yml
      loop: "{{ range(1, wireguard_clients + 1) | list }}"
      loop_control:
        loop_var: client_number
      when: not wg0_conf.stat.exists

    - name: Start and enable WireGuard
      systemd:
        name: wg-quick@wg0
        daemon_reload: yes
        state: started
        enabled: yes
      when: not ansible_check_mode

    # ============================================================
    # UFW
    # ============================================================
    - name: Set UFW default forward policy to ACCEPT
      lineinfile:
        path: /etc/default/ufw
        regexp: '^DEFAULT_FORWARD_POLICY='
        line: 'DEFAULT_FORWARD_POLICY="ACCEPT"'
        state: present
      notify: reload ufw

    - name: Configure UFW
      ufw:
        rule: "{{ item.rule | default('allow') }}"
        direction: "{{ item.direction | default('in') }}"
        proto: "{{ item.proto | default('tcp') }}"
        port: "{{ item.port }}"
      loop:
        - { port: '22' }
        - { port: '443' }
        - { port: '53', proto: 'udp' }
        - { port: '{{ wireguard_port }}', proto: 'udp' }
      notify: reload ufw

    - name: Redirect HTTP to HTTPS via iptables
      shell: |
        iptables -t nat -C PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 443 2>/dev/null || \
        iptables -t nat -A PREROUTING -p tcp --dport 80 -j REDIRECT --to-port 443
        iptables-save > /etc/iptables/rules.v4
      args:
        creates: /etc/iptables/rules.v4
      when: domain_name | length > 0

    - name: Allow UFW forwarding from VPN to WAN
      ufw:
        route: yes
        rule: allow
        interface_in: wg0
        interface_out: "{{ pihole_interface }}"

    - name: Allow UFW forwarding for VPN subnet
      ufw:
        rule: allow
        route: yes
        src: 10.8.0.0/24
        dest: any

    - name: Set UFW default policies and enable
      ufw:
        state: enabled
        policy: deny
        direction: incoming

    # ============================================================
    # Podsumowanie
    # ============================================================
    - name: Collect service statuses
      shell: |
        echo "=== Pi-hole ==="
        pihole -v 2>/dev/null || true
        echo "=== WireGuard ==="
        systemctl is-active wg-quick@wg0 2>/dev/null || echo "inactive"
        echo "=== Certbot ==="
        certbot certificates 2>/dev/null | grep -E "(Domains|Expiry)" || true
      register: summary
      changed_when: false

    - name: Display summary
      debug:
        msg:
          - "Pi-hole: https://{{ domain_name }}/admin (HTTP: http://{{ ansible_default_ipv4.address }}/admin)"
          - "WireGuard configs: /etc/wireguard/clients/"
          - "{{ summary.stdout_lines }}"

  handlers:
    - name: reload ufw
      ufw:
        state: reloaded

# ============================================================
# Play 3: Weryfikacja
# ============================================================
- name: Quick verification
  hosts: pihole_servers
  become: true
  gather_facts: false
  vars:
    pihole_ip: "{{ ansible_host | default(lookup('env','INSTANCE_IP') | default('127.0.0.1')) }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') | default('', true) }}"

  tasks:
    - name: Verify DNS and services (combined)
      shell: |
        echo "--- DNS LOCAL ---"
        dig @127.0.0.1 +short google.com || true
        echo "--- PORTS ---"
        ss -tulpn | grep -E '(:53|:80|:443)' || true
        echo "--- FTL STATUS ---"
        systemctl is-active pihole-FTL || true
        echo "--- CERT ---"
        echo | openssl s_client -connect {{ domain_name }}:443 -servername {{ domain_name }} 2>/dev/null | openssl x509 -noout -issuer -subject -dates 2>/dev/null || true
      register: verify
      changed_when: false
      failed_when: false

    - name: Check HTTPS admin panel
      uri:
        url: "https://{{ domain_name }}/admin"
        status_code: 200
        validate_certs: no
      register: web_admin
      ignore_errors: true
      when: domain_name | length > 0

    - name: Show verification results
      debug:
        var: verify.stdout_lines